<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Liste des Agents - GRH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px;
            font-family: 'Poppins', sans-serif;
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
        }
        .card-header h2 { margin: 0; }
        .card-header p { margin: 5px 0 0; opacity: 0.9; }
        .table { margin: 0; }
        .table thead { background: #f8f9fa; }
        .table thead th { font-weight: 600; padding: 15px; }
        .table tbody td { padding: 15px; vertical-align: middle; }
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        .badge-actif {
            background: #27ae60;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .btn-recu {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-recu:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
            color: white;
        }
        
        .modal-content-custom {
            border-radius: 25px;
            border: none;
            overflow: hidden;
        }
        .modal-header-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            border: none;
        }
        .modal-header-custom h5 { font-weight: 700; font-size: 22px; }
        .modal-header-custom i { margin-right: 10px; }
        .modal-body-custom { padding: 30px; background: #f8f9fa; }
        .modal-footer-custom {
            padding: 20px 25px;
            background: white;
            border-top: 1px solid #e9ecef;
        }
        .btn-cancel {
            background: #e9ecef;
            color: #6c757d;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
        }
        .btn-download {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
        }
        
        .attestation-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .attestation-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .attestation-header .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }
        .attestation-header h1 {
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            margin: 0;
        }
        .attestation-header h2 {
            font-size: 16px;
            font-weight: normal;
            margin: 5px 0 0;
            opacity: 0.9;
        }
        .attestation-body {
            padding: 30px;
            background: white;
        }
        .attestation-body .info-agent {
            background: linear-gradient(135deg, #f8f9ff 0%, #ffffff 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        .attestation-body .info-row {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e1e8ed;
        }
        .attestation-body .info-label {
            font-weight: 600;
            color: #2c3e50;
            width: 140px;
            display: inline-block;
        }
        .attestation-body .info-value {
            color: #555;
        }
        .attestation-body .badge-agent {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            display: inline-block;
            font-weight: 600;
        }
        .attestation-footer {
            background: #f8f9fa;
            padding: 20px 30px;
            text-align: right;
            border-top: 1px solid #e1e8ed;
        }
        .attestation-signature {
            border-top: 1px solid #333;
            width: 250px;
            text-align: center;
            padding-top: 10px;
            margin-left: auto;
        }
        .qr-code-container {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 10px;
        }
        .qr-code-container p {
            font-size: 10px;
            color: #999;
            margin-top: 8px;
        }
        #qrcode {
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }
        #qrcode img {
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-users"></i> Liste des Agents</h2>
                <p>Gestion du personnel</p>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Avatar</th>
                                <th>Nom complet</th>
                                <th>Sexe</th>
                                <th>Téléphone</th>
                                <th>Date recrutement</th>
                                <th>Statut</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="agentsTableBody">
                            <tr>
                                <td colspan="8" class="text-center py-5">
                                    <div class="loading-spinner"></div>
                                    <p class="mt-2">Chargement des agents...</p>
                                 </div>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Reçu -->
    <div class="modal fade" id="recuModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content modal-content-custom">
                <div class="modal-header modal-header-custom">
                    <h5 class="modal-title">
                        <i class="fas fa-file-certificate"></i> Attestation d'Agent
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body modal-body-custom" id="recuContent">
                    <!-- Le contenu de l'attestation sera chargé dynamiquement -->
                </div>
                <div class="modal-footer modal-footer-custom">
                    <button type="button" class="btn-cancel" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> Fermer
                    </button>
                    <button type="button" class="btn-download" onclick="telechargerRecu()">
                        <i class="fas fa-download"></i> Télécharger PDF
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        let currentAgent = null;
        
        function getCSRFToken() { return document.querySelector('[name=csrf-token]').getAttribute('content'); }
        
        // Charger les agents via l'API
        async function chargerAgents() {
            try {
                const response = await fetch('/api/agents/');
                const data = await response.json();
                
                if (data.success) {
                    afficherAgents(data.agents);
                } else {
                    document.getElementById('agentsTableBody').innerHTML = `
                        <tr><td colspan="8" class="text-center py-5 text-danger">
                            <i class="fas fa-exclamation-triangle"></i> Erreur de chargement
                         </div>
                        </tr>
                    `;
                }
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('agentsTableBody').innerHTML = `
                    <tr><td colspan="8" class="text-center py-5 text-danger">
                        <i class="fas fa-exclamation-triangle"></i> Erreur de connexion
                     </div>
                    </tr>
                `;
            }
        }
        
        function afficherAgents(agents) {
            const tbody = document.getElementById('agentsTableBody');
            tbody.innerHTML = '';
            
            if (agents.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="8" class="text-center py-5">
                        <i class="fas fa-users-slash fa-3x text-muted"></i>
                        <p class="mt-2">Aucun agent enregistré</p>
                     </div>
                    </tr>
                `;
                return;
            }
            
            agents.forEach(agent => {
                const row = `
                    <tr>
                        <td><strong>#${agent.id}</strong></td>
                        <td>
                            <div class="avatar">
                                ${agent.prenom.charAt(0)}${agent.nom.charAt(0)}
                            </div>
                         </div>
                        <td><strong>${agent.nom} ${agent.postnom} ${agent.prenom}</strong></td>
                        <td>
                            ${agent.sexe === 'Masculin' ? 
                                '<i class="fas fa-mars" style="color:#3498db;"></i> M' : 
                                '<i class="fas fa-venus" style="color:#e91e63;"></i> F'}
                         </div>
                        <td><i class="fas fa-phone-alt"></i> ${agent.telephone} </div>
                        <td><i class="fas fa-calendar"></i> ${agent.date_retenu}</div>
                        <td><span class="badge-actif"><i class="fas fa-check-circle"></i> Actif</span></div>
                        <td>
                            <button class="btn-recu" onclick="voirRecu(${agent.id})">
                                <i class="fas fa-file-alt"></i> Voir reçu
                            </button>
                         </div>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }
        
        function genererCodeValidation(agent) {
            // Générer un code de validation unique
            const date = new Date();
            const code = `ONEM-${agent.id}-${date.getFullYear()}${(date.getMonth()+1).toString().padStart(2,'0')}${date.getDate().toString().padStart(2,'0')}`;
            return code;
        }
        
        function genererUrlValidation(agent) {
            // URL qui serait scannée par le QR code
            const baseUrl = window.location.origin;
            return `${baseUrl}/api/agents/valider/${agent.id}/`;
        }
        
        async function voirRecu(agentId) {
            // Récupérer les informations de l'agent
            const response = await fetch('/api/agents/');
            const data = await response.json();
            
            if (data.success) {
                const agent = data.agents.find(a => a.id === agentId);
                if (agent) {
                    currentAgent = agent;
                    const html = await genererRecu(agent);
                    document.getElementById('recuContent').innerHTML = html;
                    $('#recuModal').modal('show');
                    
                    // Générer le QR code après l'affichage du modal
                    const codeValidation = genererCodeValidation(agent);
                    const urlValidation = genererUrlValidation(agent);
                    
                    // Nettoyer l'ancien QR code s'il existe
                    const qrContainer = document.getElementById('qrcode');
                    if (qrContainer) {
                        qrContainer.innerHTML = '';
                        // Créer un nouveau QR code
                        new QRCode(qrContainer, {
                            text: urlValidation,
                            width: 100,
                            height: 100,
                            colorDark: "#667eea",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.H
                        });
                    }
                }
            }
        }
        
        async function genererRecu(agent) {
            const dateActuelle = new Date().toLocaleDateString('fr-FR');
            const mois = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
            const dateRecrutement = new Date(agent.date_retenu.split('/').reverse().join('-'));
            const dateRecrutementStr = `${dateRecrutement.getDate()} ${mois[dateRecrutement.getMonth()]} ${dateRecrutement.getFullYear()}`;
            const codeValidation = genererCodeValidation(agent);
            
            return `
                <div class="attestation-container" id="attestationPrintArea">
                    <div class="attestation-header">
                        <div class="logo">
                            <i class="fas fa-building"></i>
                        </div>
                        <h1>RÉPUBLIQUE DÉMOCRATIQUE DU CONGO</h1>
                        <h2>GRH ENGENNERING SARL (GRH)</h2>
                    </div>
                    <div class="attestation-body">
                        <div style="text-align: center; margin-bottom: 20px;">
                            <span class="badge-agent">ATTESTATION D'AGENT</span>
                        </div>
                        
                        <div class="info-agent">
                            <div class="info-row">
                                <span class="info-label"><i class="fas fa-user"></i> Nom complet :</span>
                                <span class="info-value">${agent.nom} ${agent.postnom} ${agent.prenom}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label"><i class="fas fa-venus-mars"></i> Sexe :</span>
                                <span class="info-value">${agent.sexe}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label"><i class="fas fa-phone"></i> Téléphone :</span>
                                <span class="info-value">${agent.telephone}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label"><i class="fas fa-calendar-check"></i> Date de recrutement :</span>
                                <span class="info-value">${dateRecrutementStr}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label"><i class="fas fa-trophy"></i> Statut :</span>
                                <span class="info-value"><span style="background:#27ae60; color:white; padding:2px 10px; border-radius:15px;">Actif</span></span>
                            </div>
                        </div>
                        
                        <p style="text-align: center; margin-top: 20px;">
                            <strong>Félicitations !</strong> Vous êtes officiellement reconnu(e) comme agent de l'entreprise GRH ENGENNERING SARL.<br>
                            Cette attestation vous confère les droits et devoirs liés à votre fonction.
                        </p>
                        
                        <div class="qr-code-container">
                            <div id="qrcode"></div>
                            <p><strong>Code de validation :</strong> ${codeValidation}</p>
                            <p style="font-size: 10px;">Scannez ce QR code pour vérifier l'authenticité de l'attestation</p>
                        </div>
                    </div>
                    <div class="attestation-footer">
                        <div class="attestation-signature">
                            <p>Le Directeur Général</p>
                            <p style="margin-top: 30px;">(Signature et cachet)</p>
                        </div>
                        <p style="font-size: 10px; color: #999; margin-top: 10px;">Fait à Goma, le ${dateActuelle}</p>
                    </div>
                </div>
            `;
        }
        
        function telechargerRecu() {
            const element = document.getElementById('recuContent');
            const opt = {
                margin: [0.5, 0.5, 0.5, 0.5],
                filename: `attestation_agent_${currentAgent?.nom}_${currentAgent?.prenom}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, letterRendering: true },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }
        
        // Charger au chargement de la page
        document.addEventListener('DOMContentLoaded', chargerAgents);
    </script>
</body>
</html>
