<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Liste des Agents - GRH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px;
            font-family: 'Poppins', sans-serif;
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
        }
        .card-header h2 { margin: 0; }
        .card-header p { margin: 5px 0 0; opacity: 0.9; }
        .table { margin: 0; }
        .table thead { background: #f8f9fa; }
        .table thead th { font-weight: 600; padding: 15px; }
        .table tbody td { padding: 15px; vertical-align: middle; }
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        .badge-actif {
            background: #27ae60;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .btn-recu {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-recu:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
            color: white;
        }
        
        .modal-content-custom {
            border-radius: 25px;
            border: none;
            overflow: hidden;
        }
        .modal-header-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            border: none;
        }
        .modal-header-custom h5 { font-weight: 700; font-size: 22px; }
        .modal-header-custom i { margin-right: 10px; }
        .modal-body-custom { 
            padding: 20px; 
            background: #f0f2f5;
        }
        .modal-footer-custom {
            padding: 20px 25px;
            background: white;
            border-top: 1px solid #e9ecef;
        }
        .btn-cancel {
            background: #e9ecef;
            color: #6c757d;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
        }
        .btn-download {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
        }
        
        /* ========== CARTE AGENT CORRIGÉE ========== */
        /* Structure: gauche (infos) + droite (QR + dates) */
        .carte-agent {
            max-width: 600px;
            margin: 0 auto;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            color: white;
        }
        .carte-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 20px;
            text-align: center;
        }
        .carte-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }
        .carte-header small {
            font-size: 10px;
            opacity: 0.8;
        }
        
        /* NOUVEAU: layout à 2 colonnes */
        .carte-body {
            padding: 20px;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        
        /* COLONNE GAUCHE: photo + informations */
        .carte-left {
            flex: 2;
            min-width: 200px;
        }
        
        .carte-photo {
            text-align: center;
            margin-bottom: 15px;
        }
        .carte-photo img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #667eea;
            background: white;
        }
        .carte-photo .no-photo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: white;
            margin: 0 auto;
        }
        
        .carte-info {
            text-align: left;
        }
        .carte-info .nom {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 6px;
        }
        .carte-info .info-row {
            margin-bottom: 8px;
            font-size: 11px;
        }
        .carte-info .info-label {
            display: inline-block;
            width: 75px;
            opacity: 0.7;
            font-size: 10px;
        }
        .carte-info .info-value {
            font-weight: 500;
            font-size: 11px;
        }
        
        /* COLONNE DROITE: QR code + dates */
        .carte-right {
            flex: 1.2;
            min-width: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 12px;
        }
        
        .qr-code-wrapper {
            background: white;
            padding: 8px;
            border-radius: 14px;
            display: inline-block;
            margin-bottom: 12px;
        }
        .qr-code-wrapper #qrcode canvas,
        .qr-code-wrapper #qrcode img {
            width: 100px !important;
            height: 100px !important;
            display: block;
        }
        
        .dates-wrapper {
            text-align: center;
            width: 100%;
        }
        .date-item {
            font-size: 9px;
            margin: 6px 0;
            background: rgba(0,0,0,0.4);
            padding: 4px 8px;
            border-radius: 20px;
        }
        .date-item i {
            margin-right: 4px;
            font-size: 8px;
        }
        .badge-status {
            background: #27ae60;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 9px;
            margin-top: 8px;
            display: inline-block;
            font-weight: 600;
        }
        
        .carte-footer {
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            text-align: center;
            font-size: 9px;
        }
        
        @media (max-width: 500px) {
            .carte-body {
                flex-direction: column;
            }
            .carte-right {
                flex-direction: row;
                gap: 15px;
                justify-content: space-around;
            }
            .dates-wrapper {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-users"></i> Liste des Agents</h2>
                <p>Gestion du personnel</p>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Avatar</th>
                                <th>Nom complet</th>
                                <th>Sexe</th>
                                <th>Téléphone</th>
                                <th>Date recrutement</th>
                                <th>Statut</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="agentsTableBody">
                            <tr>
                                <td colspan="8" class="text-center py-5">
                                    <div class="loading-spinner"></div>
                                    <p class="mt-2">Chargement des agents...</p>
                                 </div>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Carte d'Agent -->
    <div class="modal fade" id="recuModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-md">
            <div class="modal-content modal-content-custom">
                <div class="modal-header modal-header-custom">
                    <h5 class="modal-title">
                        <i class="fas fa-id-card"></i> Carte d'Agent
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body modal-body-custom" id="recuContent">
                    <!-- Le contenu de la carte sera chargé dynamiquement -->
                </div>
                <div class="modal-footer modal-footer-custom">
                    <button type="button" class="btn-cancel" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> Fermer
                    </button>
                    <button type="button" class="btn-download" onclick="telechargerRecu()">
                        <i class="fas fa-download"></i> Télécharger PDF
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        let currentAgent = null;
        let qrcodeInstance = null; // Pour éviter les doublons
        
        function getCSRFToken() { return document.querySelector('[name=csrf-token]').getAttribute('content'); }
        
        async function chargerAgents() {
            try {
                const response = await fetch('/api/agents/');
                const data = await response.json();
                if (data.success) {
                    afficherAgents(data.agents);
                } else {
                    document.getElementById('agentsTableBody').innerHTML = `<tr><td colspan="8" class="text-center py-5 text-danger"><i class="fas fa-exclamation-triangle"></i> Erreur de chargement</td></tr>`;
                }
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('agentsTableBody').innerHTML = `<tr><td colspan="8" class="text-center py-5 text-danger"><i class="fas fa-exclamation-triangle"></i> Erreur de connexion</td></tr>`;
            }
        }
        
        function afficherAgents(agents) {
            const tbody = document.getElementById('agentsTableBody');
            tbody.innerHTML = '';
            if (agents.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-5"><i class="fas fa-users-slash fa-3x text-muted"></i><p class="mt-2">Aucun agent enregistré</p></td></tr>`;
                return;
            }
            agents.forEach(agent => {
                const row = `
                    <tr>
                        <td><strong>#${agent.id}</strong></td>
                        <td><div class="avatar">${agent.prenom.charAt(0)}${agent.nom.charAt(0)}</div></td>
                        <td><strong>${agent.nom} ${agent.postnom} ${agent.prenom}</strong></td>
                        <td>${agent.sexe === 'Masculin' ? '<i class="fas fa-mars" style="color:#3498db;"></i> M' : '<i class="fas fa-venus" style="color:#e91e63;"></i> F'}</td>
                        <td><i class="fas fa-phone-alt"></i> ${agent.telephone}</td>
                        <td><i class="fas fa-calendar"></i> ${agent.date_retenu}</td>
                        <td><span class="badge-actif"><i class="fas fa-check-circle"></i> Actif</span></td>
                        <td><button class="btn-recu" onclick="voirRecu(${agent.id})"><i class="fas fa-id-card"></i> Voir carte</button></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }
        
        function genererCodeValidation(agent) {
            const date = new Date();
            return `GRH-${agent.id}-${date.getFullYear()}${(date.getMonth()+1).toString().padStart(2,'0')}${date.getDate().toString().padStart(2,'0')}`;
        }
        
        function genererUrlValidation(agent) {
            const baseUrl = window.location.origin;
            // URL fonctionnelle pour la validation (à adapter selon vos routes)
            return `${baseUrl}/api/agents/valider/${agent.id}/`;
        }
        
        async function voirRecu(agentId) {
            const response = await fetch('/api/agents/');
            const data = await response.json();
            if (data.success) {
                const agent = data.agents.find(a => a.id === agentId);
                if (agent) {
                    currentAgent = agent;
                    let photoUrl = null;
                    try {
                        const photoResponse = await fetch(`/api/candidat/agent/${agentId}/photo/`);
                        const photoData = await photoResponse.json();
                        photoUrl = photoData.photo_url;
                    } catch(e) {
                        console.log("Photo non disponible");
                    }
                    
                    const html = genererCarteAgent(agent, photoUrl);
                    document.getElementById('recuContent').innerHTML = html;
                    $('#recuModal').modal('show');
                    
                    // Générer le QR code APRÈS que le DOM soit prêt
                    setTimeout(() => {
                        const urlValidation = genererUrlValidation(agent);
                        const qrContainer = document.getElementById('qrcode-container');
                        if (qrContainer) {
                            qrContainer.innerHTML = ''; // Nettoyer
                            // Utilisation correcte de QRCode.js
                            new QRCode(qrContainer, {
                                text: urlValidation,
                                width: 100,
                                height: 100,
                                colorDark: "#000000",
                                colorLight: "#ffffff",
                                correctLevel: QRCode.CorrectLevel.H
                            });
                        }
                    }, 100);
                }
            }
        }
        
        function genererCarteAgent(agent, photoUrl) {
            const dateActuelle = new Date().toLocaleDateString('fr-FR');
            // Date d'expiration : 1 an après la date de recrutement ou 1 an après aujourd'hui
            let expiryDate = new Date(agent.date_retenu);
            if (isNaN(expiryDate.getTime())) {
                expiryDate = new Date();
            }
            expiryDate.setFullYear(expiryDate.getFullYear() + 1);
            const dateExpiration = expiryDate.toLocaleDateString('fr-FR');
            const codeValidation = genererCodeValidation(agent);
            
            const photoHtml = photoUrl ? 
                `<img src="${photoUrl}" alt="Photo de ${agent.prenom}">` : 
                `<div class="no-photo">${agent.prenom ? agent.prenom.charAt(0).toUpperCase() : 'A'}${agent.nom ? agent.nom.charAt(0).toUpperCase() : 'G'}</div>`;
            
            return `
                <div class="carte-agent" id="attestationPrintArea">
                    <div class="carte-header">
                        <h3><i class="fas fa-building"></i> GRH ENGENNERING SARL</h3>
                        <small>RDC - Goma - N°${agent.id}</small>
                    </div>
                    <div class="carte-body">
                        <!-- COLONNE GAUCHE : photo + infos -->
                        <div class="carte-left">
                            <div class="carte-photo">
                                ${photoHtml}
                            </div>
                            <div class="carte-info">
                                <div class="nom">${agent.nom} ${agent.postnom || ''} ${agent.prenom}</div>
                                <div class="info-row"><span class="info-label"><i class="fas fa-venus-mars"></i> Sexe :</span> <span class="info-value">${agent.sexe}</span></div>
                                <div class="info-row"><span class="info-label"><i class="fas fa-phone"></i> Tél :</span> <span class="info-value">${agent.telephone}</span></div>
                                <div class="info-row"><span class="info-label"><i class="fas fa-calendar"></i> Recruté le :</span> <span class="info-value">${agent.date_retenu}</span></div>
                                <div class="info-row"><span class="info-label"><i class="fas fa-id-card"></i> Matricule :</span> <span class="info-value">${codeValidation}</span></div>
                            </div>
                        </div>
                        
                        <!-- COLONNE DROITE : QR code + dates -->
                        <div class="carte-right">
                            <div class="qr-code-wrapper">
                                <div id="qrcode-container"></div>
                            </div>
                            <div class="dates-wrapper">
                                <div class="date-item">
                                    <i class="fas fa-calendar-alt"></i> <strong>Émis le :</strong> ${dateActuelle}
                                </div>
                                <div class="date-item">
                                    <i class="fas fa-hourglass-half"></i> <strong>Actif jusqu'au :</strong> ${dateExpiration}
                                </div>
                                <div class="badge-status">
                                    <i class="fas fa-check-circle"></i> ACTIF
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="carte-footer">
                        <i class="fas fa-shield-alt"></i> Document certifié - Vérifiable par QR code
                    </div>
                </div>
            `;
        }
        
        function telechargerRecu() {
            if (!currentAgent) return;
            const element = document.getElementById('attestationPrintArea');
            if (!element) return;
            
            const opt = {
                margin: [0.5, 0.5, 0.5, 0.5],
                filename: `carte_agent_${currentAgent.nom}_${currentAgent.prenom}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, letterRendering: true, useCORS: true },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }
        
        document.addEventListener('DOMContentLoaded', chargerAgents);
    </script>
</body>
</html>
