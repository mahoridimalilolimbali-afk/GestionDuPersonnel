<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Liste des Agents - GRH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px;
            font-family: 'Poppins', sans-serif;
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
        }
        .card-header h2 { margin: 0; }
        .card-header p { margin: 5px 0 0; opacity: 0.9; }
        .table { margin: 0; }
        .table thead { background: #f8f9fa; }
        .table thead th { font-weight: 600; padding: 15px; }
        .table tbody td { padding: 15px; vertical-align: middle; }
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        .badge-actif {
            background: #27ae60;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .btn-recu {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-recu:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
            color: white;
        }
        
        .modal-content-custom {
            border-radius: 25px;
            border: none;
            overflow: hidden;
        }
        .modal-header-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            border: none;
        }
        .modal-header-custom h5 { font-weight: 700; font-size: 22px; }
        .modal-header-custom i { margin-right: 10px; }
        .modal-body-custom { padding: 30px; background: #f8f9fa; }
        .modal-footer-custom {
            padding: 20px 25px;
            background: white;
            border-top: 1px solid #e9ecef;
        }
        .btn-cancel {
            background: #e9ecef;
            color: #6c757d;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
        }
        .btn-download {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
        }
        
        /* Carte d'agent (comme une carte de service) */
        .carte-agent {
            max-width: 550px;
            margin: 0 auto;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            color: white;
        }
        .carte-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            text-align: center;
        }
        .carte-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        .carte-body {
            padding: 25px;
            display: flex;
            gap: 20px;
        }
        .carte-photo {
            flex-shrink: 0;
        }
        .carte-photo img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #667eea;
            background: white;
        }
        .carte-photo .no-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
        }
        .carte-info {
            flex: 1;
        }
        .carte-info .nom {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 8px;
        }
        .carte-info .info-row {
            margin-bottom: 10px;
            font-size: 13px;
        }
        .carte-info .info-label {
            display: inline-block;
            width: 85px;
            opacity: 0.7;
        }
        .carte-info .info-value {
            font-weight: 500;
        }
        .carte-footer {
            background: rgba(0,0,0,0.3);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }
        .carte-footer .badge {
            background: #27ae60;
            padding: 3px 10px;
            border-radius: 20px;
        }
        
        /* Style pour l'attestation (carte) dans le modal */
        .attestation-container {
            background: #1a1a2e;
            border-radius: 20px;
            overflow: hidden;
        }
        
        @media (max-width: 576px) {
            .carte-body {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .carte-info .info-label {
                width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-users"></i> Liste des Agents</h2>
                <p>Gestion du personnel</p>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Avatar</th>
                                <th>Nom complet</th>
                                <th>Sexe</th>
                                <th>Téléphone</th>
                                <th>Date recrutement</th>
                                <th>Statut</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="agentsTableBody">
                            <tr>
                                <td colspan="8" class="text-center py-5">
                                    <div class="loading-spinner"></div>
                                    <p class="mt-2">Chargement des agents...</p>
                                 </div>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Carte d'Agent -->
    <div class="modal fade" id="recuModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content modal-content-custom">
                <div class="modal-header modal-header-custom">
                    <h5 class="modal-title">
                        <i class="fas fa-id-card"></i> Carte d'Agent
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body modal-body-custom" id="recuContent" style="background: #1a1a2e;">
                    <!-- Le contenu de la carte sera chargé dynamiquement -->
                </div>
                <div class="modal-footer modal-footer-custom">
                    <button type="button" class="btn-cancel" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> Fermer
                    </button>
                    <button type="button" class="btn-download" onclick="telechargerRecu()">
                        <i class="fas fa-download"></i> Télécharger PDF
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        let currentAgent = null;
        
        function getCSRFToken() { return document.querySelector('[name=csrf-token]').getAttribute('content'); }
        
        // Charger les agents via l'API
        async function chargerAgents() {
            try {
                const response = await fetch('/api/agents/');
                const data = await response.json();
                
                if (data.success) {
                    afficherAgents(data.agents);
                } else {
                    document.getElementById('agentsTableBody').innerHTML = `
                        <tr><td colspan="8" class="text-center py-5 text-danger">
                            <i class="fas fa-exclamation-triangle"></i> Erreur de chargement
                         </div>
                        </tr>
                    `;
                }
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('agentsTableBody').innerHTML = `
                    <tr><td colspan="8" class="text-center py-5 text-danger">
                        <i class="fas fa-exclamation-triangle"></i> Erreur de connexion
                     </div>
                    </td>
                `;
            }
        }
        
        function afficherAgents(agents) {
            const tbody = document.getElementById('agentsTableBody');
            tbody.innerHTML = '';
            
            if (agents.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="8" class="text-center py-5">
                        <i class="fas fa-users-slash fa-3x text-muted"></i>
                        <p class="mt-2">Aucun agent enregistré</p>
                     </div>
                    </tr>
                `;
                return;
            }
            
            agents.forEach(agent => {
                const row = `
                    <tr>
                        <td><strong>#${agent.id}</strong></td>
                        <td>
                            <div class="avatar">
                                ${agent.prenom.charAt(0)}${agent.nom.charAt(0)}
                            </div>
                         </div>
                        <td><strong>${agent.nom} ${agent.postnom} ${agent.prenom}</strong></td>
                        <td>
                            ${agent.sexe === 'Masculin' ? 
                                '<i class="fas fa-mars" style="color:#3498db;"></i> M' : 
                                '<i class="fas fa-venus" style="color:#e91e63;"></i> F'}
                         </div>
                        <td><i class="fas fa-phone-alt"></i> ${agent.telephone} </div>
                        <td><i class="fas fa-calendar"></i> ${agent.date_retenu}</div>
                        <td><span class="badge-actif"><i class="fas fa-check-circle"></i> Actif</span></div>
                        <td>
                            <button class="btn-recu" onclick="voirRecu(${agent.id})">
                                <i class="fas fa-id-card"></i> Voir carte
                            </button>
                         </div>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }
        
        function genererCodeValidation(agent) {
            const date = new Date();
            const code = `GRH-${agent.id}-${date.getFullYear()}${(date.getMonth()+1).toString().padStart(2,'0')}${date.getDate().toString().padStart(2,'0')}`;
            return code;
        }
        
        function genererUrlValidation(agent) {
            const baseUrl = window.location.origin;
            return `${baseUrl}/api/agents/valider/${agent.id}/`;
        }
        
        // Récupérer la photo du candidat via l'API
        async function getPhotoCandidat(agent) {
            try {
                const response = await fetch(`/api/candidat/${agent.id}/photo/`);
                const data = await response.json();
                return data.photo_url;
            } catch (error) {
                return null;
            }
        }
        
        async function voirRecu(agentId) {
            const response = await fetch('/api/agents/');
            const data = await response.json();
            
            if (data.success) {
                const agent = data.agents.find(a => a.id === agentId);
                if (agent) {
                    currentAgent = agent;
                    
                    // Récupérer la photo
                    let photoUrl = null;
                    try {
                        const photoResponse = await fetch(`/api/candidat/agent/${agentId}/photo/`);
                        const photoData = await photoResponse.json();
                        photoUrl = photoData.photo_url;
                    } catch(e) {
                        console.log("Photo non disponible");
                    }
                    
                    const html = await genererCarteAgent(agent, photoUrl);
                    document.getElementById('recuContent').innerHTML = html;
                    $('#recuModal').modal('show');
                    
                    // Générer le QR code
                    const urlValidation = genererUrlValidation(agent);
                    const qrContainer = document.getElementById('qrcode');
                    if (qrContainer) {
                        qrContainer.innerHTML = '';
                        new QRCode(qrContainer, {
                            text: urlValidation,
                            width: 100,
                            height: 100,
                            colorDark: "#667eea",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.H
                        });
                    }
                }
            }
        }
        
        async function genererCarteAgent(agent, photoUrl) {
            const dateActuelle = new Date().toLocaleDateString('fr-FR');
            const codeValidation = genererCodeValidation(agent);
            
            const photoHtml = photoUrl ? 
                `<img src="${photoUrl}" alt="Photo">` : 
                `<div class="no-photo">${agent.prenom.charAt(0)}${agent.nom.charAt(0)}</div>`;
            
            return `
                <div class="carte-agent" id="attestationPrintArea">
                    <div class="carte-header">
                        <h3><i class="fas fa-building"></i> GRH ENGENNERING SARL</h3>
                        <small>RDC - Goma</small>
                    </div>
                    <div class="carte-body">
                        <div class="carte-photo">
                            ${photoHtml}
                        </div>
                        <div class="carte-info">
                            <div class="nom">${agent.nom} ${agent.postnom} ${agent.prenom}</div>
                            <div class="info-row">
                                <span class="info-label"><i class="fas fa-venus-mars"></i> Sexe :</span>
                                <span class="info-value">${agent.sexe}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label"><i class="fas fa-phone"></i> Téléphone :</span>
                                <span class="info-value">${agent.telephone}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label"><i class="fas fa-calendar"></i> Recrutement :</span>
                                <span class="info-value">${agent.date_retenu}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label"><i class="fas fa-id-card"></i> Matricule :</span>
                                <span class="info-value">${codeValidation}</span>
                            </div>
                        </div>
                    </div>
                    <div class="carte-footer">
                        <div class="qr-code-container" style="margin:0; padding:0;">
                            <div id="qrcode" style="display: inline-block;"></div>
                        </div>
                        <div>
                            <span class="badge"><i class="fas fa-check-circle"></i> Agent actif</span>
                            <div style="font-size: 9px; margin-top: 5px;">Émis le ${dateActuelle}</div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function telechargerRecu() {
            const element = document.getElementById('recuContent');
            const opt = {
                margin: [0.5, 0.5, 0.5, 0.5],
                filename: `carte_agent_${currentAgent?.nom}_${currentAgent?.prenom}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, letterRendering: true },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }
        
        document.addEventListener('DOMContentLoaded', chargerAgents);
    </script>
</body>
</html>
