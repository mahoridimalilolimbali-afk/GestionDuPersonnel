<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Mes Contrats - GRH ENGINEERING</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px;
            font-family: 'Poppins', sans-serif;
        }
        .main-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px 30px;
            color: white;
        }
        .btn-back {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            transition: all 0.3s;
        }
        .btn-back:hover {
            background: rgba(255,255,255,0.3);
            color: white;
        }
        .contrat-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border-left: 5px solid #667eea;
            transition: all 0.3s;
        }
        .contrat-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.15); }
        .badge-cdd { background: #3498db; color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; }
        .badge-cdi { background: #27ae60; color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; }
        .badge-attente { background: #f39c12; color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; }
        .badge-accepte { background: #27ae60; color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; }
        .badge-refuse { background: #e74c3c; color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; }
        .btn-accepter { background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%); color: white; border: none; padding: 8px 25px; border-radius: 10px; font-weight: 600; }
        .btn-refuser { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); color: white; border: none; padding: 8px 25px; border-radius: 10px; font-weight: 600; }
        .btn-telecharger { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); color: white; border: none; padding: 8px 25px; border-radius: 10px; font-weight: 600; }
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .card-body-custom { padding: 30px; background: #f8f9fa; }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-card">
            <div class="card-header-custom d-flex justify-content-between align-items-center">
                <div>
                    <h2><i class="fas fa-file-signature"></i> Mes Contrats</h2>
                    <p>Consultez et validez vos contrats</p>
                </div>
                <a href="/Appl/dashboardCandidat" class="btn-back">
                    <i class="fas fa-arrow-left"></i> Retour Dashboard
                </a>
            </div>
            <div class="card-body-custom" id="contratsContainer">
                <div class="text-center py-5">
                    <div class="loading-spinner"></div>
                    <p class="mt-3">Chargement de vos contrats...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Refus -->
    <div class="modal fade" id="refusModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-times-circle"></i> Motif de refus</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="refusContratId">
                    <div class="mb-3">
                        <label class="form-label">Veuillez expliquer votre motif de refus</label>
                        <textarea class="form-control" id="motifRefus" rows="4" placeholder="Salaire insuffisant, conditions non adaptées, autre offre..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-danger" onclick="confirmerRefus()">Refuser le contrat</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        function getCSRFToken() { return document.querySelector('[name=csrf-token]').getAttribute('content'); }

        function chargerContrats() {
            $('#contratsContainer').html(`
                <div class="text-center py-5">
                    <div class="loading-spinner"></div>
                    <p class="mt-3">Chargement de vos contrats...</p>
                </div>
            `);
            
            $.ajax({
                url: '/api/mes-contrats/',
                method: 'GET',
                headers: { 'X-CSRFToken': getCSRFToken() },
                success: function(response) {
                    if (response.success) {
                        afficherContrats(response.contrats);
                    } else {
                        $('#contratsContainer').html(`
                            <div class="text-center py-5 text-danger">
                                <i class="fas fa-exclamation-triangle" style="font-size: 48px;"></i>
                                <p class="mt-3">${response.error || 'Erreur de chargement'}</p>
                                <button class="btn btn-primary mt-3" onclick="chargerContrats()">
                                    <i class="fas fa-sync-alt"></i> Réessayer
                                </button>
                            </div>
                        `);
                    }
                },
                error: function() {
                    $('#contratsContainer').html(`
                        <div class="text-center py-5 text-danger">
                            <i class="fas fa-exclamation-triangle" style="font-size: 48px;"></i>
                            <p class="mt-3">Erreur de connexion au serveur</p>
                            <button class="btn btn-primary mt-3" onclick="chargerContrats()">
                                <i class="fas fa-sync-alt"></i> Réessayer
                            </button>
                        </div>
                    `);
                }
            });
        }

        function afficherContrats(contrats) {
            const container = $('#contratsContainer');
            container.empty();

            if (contrats.length === 0) {
                container.html(`
                    <div class="text-center py-5">
                        <i class="fas fa-folder-open" style="font-size: 48px; color: #ccc;"></i>
                        <p class="mt-3">Aucun contrat disponible</p>
                    </div>
                `);
                return;
            }

            contrats.forEach(contrat => {
                let badgeType = contrat.type_contrat === 'determine' ? 
                    '<span class="badge-cdd">📅 CDD - Durée déterminée</span>' : 
                    '<span class="badge-cdi">📅 CDI - Durée indéterminée</span>';
                
                let statutBadge = '';
                let actionsHtml = '';
                
                if (contrat.statut === 'en_attente') {
                    statutBadge = '<span class="badge-attente">⏳ En attente de validation</span>';
                    actionsHtml = `
                        <div class="mt-4 text-end">
                            <button class="btn-refuser me-2" onclick="ouvrirModalRefus(${contrat.id})">
                                <i class="fas fa-times"></i> Refuser
                            </button>
                            <button class="btn-accepter" onclick="accepterContrat(${contrat.id})">
                                <i class="fas fa-check"></i> Accepter
                            </button>
                        </div>
                    `;
                } else if (contrat.statut === 'accepte') {
                    statutBadge = '<span class="badge-accepte">✅ Contrat accepté</span>';
                    actionsHtml = `<div class="mt-3 alert alert-success">✅ Merci pour votre confiance. Vous serez informé(e) dans les plus brefs délais.</div>`;
                } else if (contrat.statut === 'refuse') {
                    statutBadge = '<span class="badge-refuse">❌ Contrat refusé</span>';
                    actionsHtml = `<div class="mt-3 alert alert-warning">❌ Vous avez refusé ce contrat. Nous vous souhaitons bonne chance.</div>`;
                }
                
                const fichierHtml = contrat.fichier_url ? 
                    `<button class="btn-telecharger" onclick="window.open('${contrat.fichier_url}', '_blank')">
                        <i class="fas fa-download"></i> Télécharger le contrat
                    </button>` : 
                    '<span class="text-muted">Aucun fichier disponible</span>';
                
                container.append(`
                    <div class="contrat-card">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h4><i class="fas fa-file-contract"></i> ${contrat.offre_titre}</h4>
                                <div class="mt-2">
                                    ${badgeType}
                                    ${statutBadge}
                                </div>
                            </div>
                            <small class="text-muted">Proposé le ${contrat.date_creation}</small>
                        </div>
                        <div class="mt-3">
                            <p><strong>📅 Période :</strong> ${contrat.duree_texte}</p>
                            <p><strong>📄 Contrat :</strong> ${fichierHtml}</p>
                        </div>
                        ${actionsHtml}
                    </div>
                `);
            });
        }

        function ouvrirModalRefus(contratId) {
            $('#refusContratId').val(contratId);
            $('#motifRefus').val('');
            $('#refusModal').modal('show');
        }

        function confirmerRefus() {
            const contratId = $('#refusContratId').val();
            const motifRefus = $('#motifRefus').val();
            
            if (!motifRefus) {
                Swal.fire({ icon: 'error', title: 'Erreur', text: 'Veuillez expliquer votre motif de refus' });
                return;
            }
            
            Swal.fire({
                title: 'Confirmation',
                text: 'Êtes-vous sûr de vouloir refuser ce contrat ?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e74c3c',
                confirmButtonText: 'Oui, refuser'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Traitement...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    
                    $.ajax({
                        url: `/api/contrat/repondre/${contratId}/`,
                        method: 'POST',
                        data: JSON.stringify({ decision: 'refuser', motif_refus: motifRefus }),
                        headers: { 'X-CSRFToken': getCSRFToken(), 'Content-Type': 'application/json' },
                        success: function(response) {
                            Swal.close();
                            if (response.success) {
                                Swal.fire({ icon: 'success', title: 'Refus enregistré', text: response.message });
                                $('#refusModal').modal('hide');
                                chargerContrats();
                            } else {
                                Swal.fire({ icon: 'error', title: 'Erreur', text: response.message });
                            }
                        },
                        error: function() { Swal.close(); Swal.fire({ icon: 'error', title: 'Erreur', text: 'Erreur lors du refus' }); }
                    });
                }
            });
        }

        function accepterContrat(contratId) {
            Swal.fire({
                title: 'Confirmation',
                text: 'Voulez-vous vraiment accepter ce contrat ?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#27ae60',
                confirmButtonText: 'Oui, j\'accepte'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Traitement...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    
                    $.ajax({
                        url: `/api/contrat/repondre/${contratId}/`,
                        method: 'POST',
                        data: JSON.stringify({ decision: 'accepter' }),
                        headers: { 'X-CSRFToken': getCSRFToken(), 'Content-Type': 'application/json' },
                        success: function(response) {
                            Swal.close();
                            if (response.success) {
                                let msg = response.message;
                                if (response.email_envoye) {
                                    msg += `<br><br><i class="fas fa-envelope text-success"></i> ${response.email_message}`;
                                }
                                Swal.fire({ icon: 'success', title: 'Merci !', html: msg });
                                chargerContrats();
                                setTimeout(() => { window.location.reload(); }, 3000);
                            } else {
                                Swal.fire({ icon: 'error', title: 'Erreur', text: response.message });
                            }
                        },
                        error: function() { Swal.close(); Swal.fire({ icon: 'error', title: 'Erreur', text: 'Erreur lors de l\'acceptation' }); }
                    });
                }
            });
        }

        $(document).ready(function() { chargerContrats(); });
    </script>
</body>
</html>
