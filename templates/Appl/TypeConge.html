<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Gestion des Types de Congé - ONEM</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1200px; margin: auto; }
        .main-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px 35px;
            color: white;
        }
        .header-title {
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header-title i { font-size: 32px; margin-right: 12px; }
        .badge-stats {
            background: rgba(255,255,255,0.2);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 14px;
        }
        .card-body-custom { padding: 35px; background: #f8f9fa; }
        
        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }
        .btn-add i { margin-right: 8px; }
        
        .table-custom {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            width: 100%;
        }
        .table-custom thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .table-custom thead th {
            color: white;
            font-weight: 600;
            padding: 18px 12px;
            border: none;
            font-size: 14px;
            text-align: center;
        }
        .table-custom tbody tr {
            transition: all 0.3s ease;
            border-bottom: 1px solid #e9ecef;
        }
        .table-custom tbody tr:hover {
            background: #f8f9ff;
            transform: scale(1.01);
        }
        .table-custom tbody td {
            padding: 14px 12px;
            vertical-align: middle;
            text-align: center;
        }
        
        .btn-action {
            padding: 8px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 12px;
            margin: 0 4px;
            border: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-edit {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
        }
        .btn-delete {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }
        .btn-action:hover { transform: translateY(-2px); color: white; }
        
        .badge-duree {
            background: #27ae60;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        
        .modal-content-custom {
            border-radius: 25px;
            border: none;
            overflow: hidden;
        }
        .modal-header-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            border: none;
        }
        .modal-header-custom h5 { font-weight: 700; font-size: 22px; }
        .modal-header-custom i { margin-right: 10px; }
        .modal-body-custom { padding: 30px; background: #f8f9fa; }
        .modal-footer-custom {
            padding: 20px 25px;
            background: white;
            border-top: 1px solid #e9ecef;
        }
        
        .form-group-custom { margin-bottom: 25px; }
        .form-label-custom {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
            display: block;
            font-size: 14px;
        }
        .form-label-custom i { margin-right: 6px; color: #667eea; }
        .form-control-custom, .form-select-custom, textarea.form-control-custom {
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            padding: 12px 15px;
            width: 100%;
            transition: all 0.3s ease;
        }
        .form-control-custom:focus, .form-select-custom:focus, textarea.form-control-custom:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            outline: none;
        }
        textarea.form-control-custom { resize: vertical; min-height: 100px; }
        
        .btn-cancel {
            background: #e9ecef;
            color: #6c757d;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
        }
        .btn-submit {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
        }
        .btn-danger-custom {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
        }
        
        .empty-state-custom {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 20px;
        }
        .empty-state-custom i {
            font-size: 80px;
            color: #667eea;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .text-left { text-align: left !important; }
        
        @media (max-width: 768px) {
            .card-header-custom { padding: 20px; }
            .header-title { font-size: 20px; flex-direction: column; text-align: center; }
            .card-body-custom { padding: 20px; }
            .btn-action { padding: 5px 12px; font-size: 11px; }
            .table-custom thead th, .table-custom tbody td { padding: 10px 8px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>Traitement en cours...</p>
        </div>
    </div>
    
    <div class="container">
        <div class="main-card">
            <div class="card-header-custom">
                <div class="header-title">
                    <div>
                        <i class="fas fa-umbrella-beach"></i>
                        Gestion des Types de Congé
                    </div>
                    <div class="badge-stats">
                        <i class="fas fa-list"></i>
                        <span id="totalCount">0</span> type(s)
                    </div>
                </div>
            </div>
            
            <div class="card-body-custom">
                <div class="text-end">
                    <button class="btn-add" data-bs-toggle="modal" data-bs-target="#ajouterModal">
                        <i class="fas fa-plus-circle"></i> Ajouter un type de congé
                    </button>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-custom">
                        <thead>
                            <tr>
                                <th style="width: 5%;"><i class="fas fa-hashtag"></i> ID</th>
                                <th style="width: 35%; text-align: left;"><i class="fas fa-tag"></i> Désignation</th>
                                <th style="width: 15%;"><i class="fas fa-calendar-day"></i> Durée</th>
                                <th style="width: 30%; text-align: left;"><i class="fas fa-align-left"></i> Description</th>
                                <th style="width: 15%;"><i class="fas fa-cogs"></i> Actions</th>
                            </tr>
                        </thead>
                        <tbody id="typeCongeTableBody">
                            <tr>
                                <td colspan="5" class="text-center py-5">
                                    <div class="loading-spinner" style="margin: 0 auto;"></div>
                                    <p class="mt-3">Chargement...</p>
                                 </div>
                             </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Ajouter -->
    <div class="modal fade" id="ajouterModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-custom">
                <div class="modal-header modal-header-custom">
                    <h5 class="modal-title">
                        <i class="fas fa-plus-circle"></i> Nouveau type de congé
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body modal-body-custom">
                    <form id="ajouterForm" onsubmit="return false;">
                        <div class="form-group-custom">
                            <label class="form-label-custom">
                                <i class="fas fa-tag"></i> Désignation <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control-custom" id="ajouterDesignation" 
                                   placeholder="Ex: Congé annuel, Congé de maladie, Congé maternité..." autocomplete="off">
                        </div>
                        <div class="form-group-custom">
                            <label class="form-label-custom">
                                <i class="fas fa-calendar-day"></i> Durée (en jours) <span class="text-danger">*</span>
                            </label>
                            <input type="number" class="form-control-custom" id="ajouterDuree" 
                                   placeholder="Ex: 30, 15, 10..." min="1" step="1">
                        </div>
                        <div class="form-group-custom">
                            <label class="form-label-custom">
                                <i class="fas fa-align-left"></i> Description
                            </label>
                            <textarea class="form-control-custom" id="ajouterDescription" rows="3" 
                                      placeholder="Description optionnelle..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer modal-footer-custom">
                    <button type="button" class="btn-cancel" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> Annuler
                    </button>
                    <button type="button" class="btn-submit" onclick="ajouterTypeConge()">
                        <i class="fas fa-save"></i> Ajouter
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Modifier -->
    <div class="modal fade" id="modifierModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-custom">
                <div class="modal-header modal-header-custom">
                    <h5 class="modal-title">
                        <i class="fas fa-edit"></i> Modifier le type de congé
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body modal-body-custom">
                    <form id="modifierForm" onsubmit="return false;">
                        <input type="hidden" id="modifierId">
                        <div class="form-group-custom">
                            <label class="form-label-custom">
                                <i class="fas fa-tag"></i> Désignation <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control-custom" id="modifierDesignation">
                        </div>
                        <div class="form-group-custom">
                            <label class="form-label-custom">
                                <i class="fas fa-calendar-day"></i> Durée (en jours) <span class="text-danger">*</span>
                            </label>
                            <input type="number" class="form-control-custom" id="modifierDuree" min="1" step="1">
                        </div>
                        <div class="form-group-custom">
                            <label class="form-label-custom">
                                <i class="fas fa-align-left"></i> Description
                            </label>
                            <textarea class="form-control-custom" id="modifierDescription" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer modal-footer-custom">
                    <button type="button" class="btn-cancel" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> Annuler
                    </button>
                    <button type="button" class="btn-submit" onclick="modifierTypeConge()">
                        <i class="fas fa-save"></i> Mettre à jour
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Supprimer -->
    <div class="modal fade" id="supprimerModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-custom">
                <div class="modal-header modal-header-custom">
                    <h5 class="modal-title">
                        <i class="fas fa-trash-alt"></i> Confirmer la suppression
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body modal-body-custom">
                    <div style="text-align: center; padding: 20px;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 60px; color: #e74c3c; margin-bottom: 20px;"></i>
                        <p style="font-size: 16px; color: #2c3e50; margin-bottom: 10px;">
                            Êtes-vous sûr de vouloir supprimer ce type de congé ?
                        </p>
                        <p class="text-danger mb-0">
                            <i class="fas fa-info-circle"></i> Cette action est irréversible.
                        </p>
                        <input type="hidden" id="supprimerId">
                    </div>
                </div>
                <div class="modal-footer modal-footer-custom">
                    <button type="button" class="btn-cancel" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> Annuler
                    </button>
                    <button type="button" class="btn-danger-custom" onclick="supprimerTypeConge()">
                        <i class="fas fa-trash-alt"></i> Supprimer
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        let currentTypesConge = [];
        
        function getCSRFToken() { return document.querySelector('[name=csrf-token]').getAttribute('content'); }
        function showLoading() { $('#loadingOverlay').fadeIn(300); }
        function hideLoading() { $('#loadingOverlay').fadeOut(300); }
        
        function showSuccess(message) {
            Swal.fire({
                icon: 'success',
                title: 'Succès !',
                text: message,
                timer: 2500,
                showConfirmButton: false,
                toast: true,
                position: 'top-end'
            });
        }
        
        function showError(message) {
            Swal.fire({
                icon: 'error',
                title: 'Erreur',
                text: message,
                confirmButtonColor: '#e74c3c'
            });
        }
        
        function showWarning(message) {
            Swal.fire({
                icon: 'warning',
                title: 'Attention',
                text: message,
                confirmButtonColor: '#f39c12'
            });
        }
        
        function chargerTypeConge() {
            showLoading();
            
            $.ajax({
                url: '/api/type-conge/',
                method: 'GET',
                headers: { 'X-CSRFToken': getCSRFToken() },
                success: function(response) {
                    hideLoading();
                    if (response.success) {
                        currentTypesConge = response.types_conge;
                        afficherTypeConge(response.types_conge);
                        $('#totalCount').text(response.total);
                    } else {
                        showError(response.error || 'Impossible de charger les données');
                    }
                },
                error: function() {
                    hideLoading();
                    showError('Erreur de connexion au serveur');
                }
            });
        }
        
        function afficherTypeConge(types) {
            const tbody = $('#typeCongeTableBody');
            tbody.empty();
            
            if (!types || types.length === 0) {
                tbody.html(`
                    <tr><td colspan="5"><div class="empty-state-custom">
                        <i class="fas fa-folder-open"></i>
                        <p>Aucun type de congé trouvé</p>
                        <button class="btn-add" data-bs-toggle="modal" data-bs-target="#ajouterModal">
                            <i class="fas fa-plus-circle"></i> Créer le premier type
                        </button>
                    </div><\/div><\/td><\/tr>
                `);
                return;
            }
            
            types.forEach(type => {
                const row = `
                    <tr class="fade-in">
                        <td style="text-align: center;"><strong style="color: #667eea;">#${type.id}</strong><\/td>
                        <td style="text-align: left;"><strong>${escapeHtml(type.designation)}</strong><\/td>
                        <td style="text-align: center;"><span class="badge-duree"><i class="fas fa-calendar-day"></i> ${type.duree} jour(s)</span><\/td>
                        <td style="text-align: left;"><small>${escapeHtml(type.description || '-')}<\/small><\/td>
                        <td style="text-align: center;">
                            <button class="btn-action btn-edit" onclick="openEditModal(${type.id})">
                                <i class="fas fa-edit"></i> Modifier
                            </button>
                            <button class="btn-action btn-delete" onclick="openDeleteModal(${type.id})">
                                <i class="fas fa-trash-alt"></i> Supprimer
                            </button>
                        <\/td>
                    <\/tr>
                `;
                tbody.append(row);
            });
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function ajouterTypeConge() {
            const designation = $('#ajouterDesignation').val().trim();
            const duree = $('#ajouterDuree').val();
            const description = $('#ajouterDescription').val().trim();
            
            if (!designation) {
                showWarning('Veuillez saisir la désignation');
                $('#ajouterDesignation').focus();
                return;
            }
            
            if (!duree) {
                showWarning('Veuillez saisir la durée');
                $('#ajouterDuree').focus();
                return;
            }
            
            showLoading();
            
            $.ajax({
                url: '/api/type-conge/ajouter/',
                method: 'POST',
                data: JSON.stringify({
                    designation: designation,
                    duree: duree,
                    description: description
                }),
                headers: {
                    'X-CSRFToken': getCSRFToken(),
                    'Content-Type': 'application/json'
                },
                success: function(response) {
                    hideLoading();
                    if (response.success) {
                        showSuccess(response.message);
                        $('#ajouterModal').modal('hide');
                        $('#ajouterForm')[0].reset();
                        chargerTypeConge();
                    } else {
                        showError(response.message);
                    }
                },
                error: function(xhr) {
                    hideLoading();
                    const message = xhr.responseJSON?.message || 'Erreur lors de l\'ajout';
                    showError(message);
                }
            });
        }
        
        function openEditModal(id) {
            const type = currentTypesConge.find(t => t.id === id);
            if (type) {
                $('#modifierId').val(id);
                $('#modifierDesignation').val(type.designation);
                $('#modifierDuree').val(type.duree);
                $('#modifierDescription').val(type.description || '');
                $('#modifierModal').modal('show');
            }
        }
        
        function modifierTypeConge() {
            const id = $('#modifierId').val();
            const designation = $('#modifierDesignation').val().trim();
            const duree = $('#modifierDuree').val();
            const description = $('#modifierDescription').val().trim();
            
            if (!designation) {
                showWarning('Veuillez saisir la désignation');
                $('#modifierDesignation').focus();
                return;
            }
            
            if (!duree) {
                showWarning('Veuillez saisir la durée');
                $('#modifierDuree').focus();
                return;
            }
            
            showLoading();
            
            $.ajax({
                url: `/api/type-conge/modifier/${id}/`,
                method: 'POST',
                data: JSON.stringify({
                    designation: designation,
                    duree: duree,
                    description: description
                }),
                headers: {
                    'X-CSRFToken': getCSRFToken(),
                    'Content-Type': 'application/json'
                },
                success: function(response) {
                    hideLoading();
                    if (response.success) {
                        showSuccess(response.message);
                        $('#modifierModal').modal('hide');
                        $('#modifierForm')[0].reset();
                        chargerTypeConge();
                    } else {
                        showError(response.message);
                    }
                },
                error: function(xhr) {
                    hideLoading();
                    const message = xhr.responseJSON?.message || 'Erreur lors de la modification';
                    showError(message);
                }
            });
        }
        
        function openDeleteModal(id) {
            $('#supprimerId').val(id);
            $('#supprimerModal').modal('show');
        }
        
        function supprimerTypeConge() {
            const id = $('#supprimerId').val();
            
            showLoading();
            
            $.ajax({
                url: `/api/type-conge/supprimer/${id}/`,
                method: 'POST',
                headers: { 'X-CSRFToken': getCSRFToken() },
                success: function(response) {
                    hideLoading();
                    if (response.success) {
                        showSuccess(response.message);
                        $('#supprimerModal').modal('hide');
                        chargerTypeConge();
                    } else {
                        showError(response.message);
                    }
                },
                error: function(xhr) {
                    hideLoading();
                    const message = xhr.responseJSON?.message || 'Erreur lors de la suppression';
                    showError(message);
                }
            });
        }
        
        $(document).ready(function() {
            chargerTypeConge();
        });
        
        $('#ajouterModal').on('hidden.bs.modal', function() {
            $('#ajouterForm')[0].reset();
        });
        
        $('#modifierModal').on('hidden.bs.modal', function() {
            $('#modifierForm')[0].reset();
        });
    </script>
</body>
</html>
