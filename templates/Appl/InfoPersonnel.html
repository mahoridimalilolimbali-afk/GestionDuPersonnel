<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Mes Informations Personnelles - GRH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1000px; margin: auto; }
        .main-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px 35px;
            color: white;
        }
        .header-title {
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header-title i { font-size: 32px; margin-right: 12px; }
        .badge-stats {
            background: rgba(255,255,255,0.2);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 14px;
        }
        .card-body-custom { padding: 35px; background: #f8f9fa; }
        
        .avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 48px;
            margin: 0 auto 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        
        .info-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }
        .info-card h4 {
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 600;
            border-bottom: 2px solid #e1e8ed;
            padding-bottom: 10px;
        }
        .info-card h4 i { margin-right: 10px; }
        .info-row {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e1e8ed;
            display: flex;
            flex-wrap: wrap;
        }
        .info-label {
            font-weight: 600;
            color: #2c3e50;
            width: 180px;
        }
        .info-label i { width: 25px; color: #667eea; margin-right: 8px; }
        .info-value { flex: 1; color: #555; }
        
        .btn-modifier {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-modifier:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
            color: white;
        }
        .btn-enregistrer {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-enregistrer:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
            color: white;
        }
        .btn-annuler {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-annuler:hover {
            background: #7f8c8d;
            transform: translateY(-2px);
        }
        
        .form-group { margin-bottom: 20px; }
        .form-label {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
            display: block;
        }
        .form-label i { margin-right: 6px; color: #667eea; }
        .form-control {
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            outline: none;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .edit-mode { display: none; }
        .view-mode { display: block; }
        
        @media (max-width: 768px) {
            .card-header-custom { padding: 20px; }
            .header-title { font-size: 20px; flex-direction: column; text-align: center; }
            .card-body-custom { padding: 20px; }
            .info-label { width: 140px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>Traitement en cours...</p>
        </div>
    </div>
    
    <div class="container">
        <div class="main-card">
            <div class="card-header-custom">
                <div class="header-title">
                    <div>
                        <i class="fas fa-user-circle"></i>
                        Mes Informations Personnelles
                    </div>
                    <div class="badge-stats">
                        <i class="fas fa-id-card"></i>
                        Mon profil
                    </div>
                </div>
            </div>
            
            <div class="card-body-custom">
                <!-- Mode Visualisation -->
                <div id="viewMode">
                    <div class="avatar-large" id="avatarView">JD</div>
                    
                    <div class="info-card">
                        <h4><i class="fas fa-user"></i> Identité</h4>
                        <div class="info-row">
                            <div class="info-label"><i class="fas fa-user"></i> Nom complet :</div>
                            <div class="info-value" id="viewNomComplet">-</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label"><i class="fas fa-venus-mars"></i> Sexe :</div>
                            <div class="info-value" id="viewSexe">-</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label"><i class="fas fa-globe"></i> Nationalité :</div>
                            <div class="info-value" id="viewNationalite">-</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label"><i class="fas fa-map-marker-alt"></i> Lieu de naissance :</div>
                            <div class="info-value" id="viewLieuNaissance">-</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label"><i class="fas fa-city"></i> Ville :</div>
                            <div class="info-value" id="viewVille">-</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label"><i class="fas fa-calendar"></i> Date de naissance :</div>
                            <div class="info-value" id="viewDateNaissance">-</div>
                        </div>
                    </div>
                    
                    <div class="info-card">
                        <h4><i class="fas fa-address-card"></i> Contact & Adresse</h4>
                        <div class="info-row">
                            <div class="info-label"><i class="fas fa-envelope"></i> Email :</div>
                            <div class="info-value" id="viewEmail">-</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label"><i class="fas fa-user-tag"></i> Nom d'utilisateur :</div>
                            <div class="info-value" id="viewUsername">-</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label"><i class="fas fa-phone"></i> Téléphone :</div>
                            <div class="info-value" id="viewTelephone">-</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label"><i class="fas fa-map-marker"></i> Quartier :</div>
                            <div class="info-value" id="viewQuartier">-</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label"><i class="fas fa-road"></i> Avenue :</div>
                            <div class="info-value" id="viewAvenue">-</div>
                        </div>
                    </div>
                    
                    <button class="btn-modifier" onclick="activerEdition()">
                        <i class="fas fa-edit"></i> Modifier mes informations
                    </button>
                </div>
                
                <!-- Mode Édition -->
                <div id="editMode" style="display: none;">
                    <form id="editForm" onsubmit="return false;">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label class="form-label"><i class="fas fa-user"></i> Nom *</label>
                                    <input type="text" class="form-control" id="editNom" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label class="form-label"><i class="fas fa-user"></i> Postnom *</label>
                                    <input type="text" class="form-control" id="editPostnom" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label class="form-label"><i class="fas fa-user"></i> Prénom *</label>
                                    <input type="text" class="form-control" id="editPrenom" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label"><i class="fas fa-venus-mars"></i> Sexe *</label>
                                    <select class="form-control" id="editSexe" required>
                                        <option value="Masculin">Masculin</option>
                                        <option value="Féminin">Féminin</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label"><i class="fas fa-globe"></i> Nationalité *</label>
                                    <input type="text" class="form-control" id="editNationalite" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label"><i class="fas fa-map-marker-alt"></i> Lieu de naissance *</label>
                                    <input type="text" class="form-control" id="editLieuNaissance" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label"><i class="fas fa-city"></i> Ville *</label>
                                    <input type="text" class="form-control" id="editVille" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label"><i class="fas fa-calendar"></i> Date de naissance *</label>
                                    <input type="date" class="form-control" id="editDateNaissance" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label"><i class="fas fa-phone"></i> Téléphone *</label>
                                    <input type="tel" class="form-control" id="editTelephone" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label"><i class="fas fa-map-marker"></i> Quartier *</label>
                                    <input type="text" class="form-control" id="editQuartier" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label"><i class="fas fa-road"></i> Avenue</label>
                                    <input type="text" class="form-control" id="editAvenue">
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
                                    <input type="email" class="form-control" id="editEmail" readonly style="background:#f5f5f5;">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label"><i class="fas fa-user-tag"></i> Nom d'utilisateur</label>
                                    <input type="text" class="form-control" id="editUsername" readonly style="background:#f5f5f5;">
                                </div>
                            </div>
                        </div>
                        
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <button type="button" class="btn-annuler" onclick="annulerEdition()">
                                    <i class="fas fa-times"></i> Annuler
                                </button>
                            </div>
                            <div class="col-md-6">
                                <button type="button" class="btn-enregistrer" onclick="enregistrerModifications()">
                                    <i class="fas fa-save"></i> Enregistrer
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        let utilisateurData = {};
        
        function getCSRFToken() { return document.querySelector('[name=csrf-token]').getAttribute('content'); }
        function showLoading() { $('#loadingOverlay').fadeIn(300); }
        function hideLoading() { $('#loadingOverlay').fadeOut(300); }
        
        function showSuccess(message) {
            Swal.fire({
                icon: 'success',
                title: 'Succès !',
                text: message,
                timer: 2500,
                showConfirmButton: false,
                toast: true,
                position: 'top-end'
            });
        }
        
        function showError(message) {
            Swal.fire({
                icon: 'error',
                title: 'Erreur',
                text: message,
                confirmButtonColor: '#e74c3c'
            });
        }
        
        // Charger les informations de l'utilisateur connecté
        function chargerInfosUtilisateur() {
            showLoading();
            
            $.ajax({
                url: '/api/utilisateur/infos/',
                method: 'GET',
                headers: { 'X-CSRFToken': getCSRFToken() },
                success: function(response) {
                    hideLoading();
                    if (response.success) {
                        utilisateurData = response.data;
                        afficherInfos(utilisateurData);
                        remplirFormulaireEdition(utilisateurData);
                    } else {
                        showError(response.error || 'Impossible de charger les informations');
                    }
                },
                error: function() {
                    hideLoading();
                    showError('Erreur de connexion au serveur');
                }
            });
        }
        
        function afficherInfos(data) {
            // Avatar
            const initiales = (data.prenom.charAt(0) + data.nom.charAt(0)).toUpperCase();
            $('#avatarView').text(initiales);
            
            // Identité
            $('#viewNomComplet').text(`${data.nom} ${data.postnom} ${data.prenom}`);
            $('#viewSexe').text(data.sexe);
            $('#viewNationalite').text(data.nationalite);
            $('#viewLieuNaissance').text(data.lieuNaissance);
            $('#viewVille').text(data.ville);
            $('#viewDateNaissance').text(data.dateNaissance);
            
            // Contact
            $('#viewEmail').text(data.email);
            $('#viewUsername').text(data.username);
            $('#viewTelephone').text(data.telephone);
            $('#viewQuartier').text(data.quartier);
            $('#viewAvenue').text(data.avenue || 'Non renseignée');
        }
        
        function remplirFormulaireEdition(data) {
            $('#editNom').val(data.nom);
            $('#editPostnom').val(data.postnom);
            $('#editPrenom').val(data.prenom);
            $('#editSexe').val(data.sexe);
            $('#editNationalite').val(data.nationalite);
            $('#editLieuNaissance').val(data.lieuNaissance);
            $('#editVille').val(data.ville);
            $('#editDateNaissance').val(data.dateNaissanceRaw);
            $('#editTelephone').val(data.telephone);
            $('#editQuartier').val(data.quartier);
            $('#editAvenue').val(data.avenue || '');
            $('#editEmail').val(data.email);
            $('#editUsername').val(data.username);
        }
        
        function activerEdition() {
            $('#viewMode').hide();
            $('#editMode').show();
        }
        
        function annulerEdition() {
            $('#editMode').hide();
            $('#viewMode').show();
            remplirFormulaireEdition(utilisateurData);
        }
        
        function enregistrerModifications() {
            const formData = {
                nom: $('#editNom').val().trim(),
                postnom: $('#editPostnom').val().trim(),
                prenom: $('#editPrenom').val().trim(),
                sexe: $('#editSexe').val(),
                nationalite: $('#editNationalite').val().trim(),
                lieuNaissance: $('#editLieuNaissance').val().trim(),
                ville: $('#editVille').val().trim(),
                dateNaissance: $('#editDateNaissance').val(),
                telephone: $('#editTelephone').val().trim(),
                quartier: $('#editQuartier').val().trim(),
                avenue: $('#editAvenue').val().trim()
            };
            
            // Validation
            if (!formData.nom || !formData.postnom || !formData.prenom || !formData.telephone || !formData.quartier) {
                showError('Veuillez remplir tous les champs obligatoires');
                return;
            }
            
            showLoading();
            
            $.ajax({
                url: '/api/utilisateur/modifier/',
                method: 'POST',
                data: JSON.stringify(formData),
                headers: {
                    'X-CSRFToken': getCSRFToken(),
                    'Content-Type': 'application/json'
                },
                success: function(response) {
                    hideLoading();
                    if (response.success) {
                        showSuccess(response.message);
                        chargerInfosUtilisateur();
                        $('#editMode').hide();
                        $('#viewMode').show();
                    } else {
                        showError(response.message);
                    }
                },
                error: function(xhr) {
                    hideLoading();
                    const message = xhr.responseJSON?.message || 'Erreur lors de la modification';
                    showError(message);
                }
            });
        }
        
        $(document).ready(function() {
            chargerInfosUtilisateur();
        });
    </script>
</body>
</html>
