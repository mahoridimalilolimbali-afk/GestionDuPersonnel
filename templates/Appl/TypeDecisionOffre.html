<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Types de Décision - GRH</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1200px; margin: auto; }
        .main-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px 35px;
            color: white;
        }
        .header-title {
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header-title i { font-size: 32px; margin-right: 12px; }
        .badge-stats {
            background: rgba(255,255,255,0.2);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 14px;
        }
        .card-body-custom { padding: 35px; background: #f8f9fa; }
        
        .btn-add {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.4);
            color: white;
        }
        
        .table-custom {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            width: 100%;
        }
        .table-custom thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .table-custom thead th {
            color: white;
            font-weight: 600;
            padding: 15px 12px;
            border: none;
            font-size: 13px;
            text-align: center;
        }
        .table-custom tbody tr {
            transition: all 0.3s ease;
            border-bottom: 1px solid #e9ecef;
        }
        .table-custom tbody tr:hover {
            background: #f8f9ff;
            transform: scale(1.01);
        }
        .table-custom tbody td {
            padding: 12px 12px;
            vertical-align: middle;
            text-align: center;
        }
        
        .btn-action {
            padding: 6px 15px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 11px;
            margin: 0 3px;
            border: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-edit {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
        }
        .btn-delete {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }
        .btn-action:hover { transform: translateY(-2px); color: white; }
        
        .modal-content-custom {
            border-radius: 25px;
            border: none;
            overflow: hidden;
        }
        .modal-header-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            border: none;
        }
        .modal-header-custom h5 { font-weight: 700; font-size: 22px; }
        .modal-header-custom i { margin-right: 10px; }
        .modal-body-custom { padding: 30px; background: #f8f9fa; }
        .modal-footer-custom {
            padding: 20px 25px;
            background: white;
            border-top: 1px solid #e9ecef;
        }
        
        .form-group-custom { margin-bottom: 25px; }
        .form-label-custom {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
            display: block;
        }
        .form-label-custom i { margin-right: 6px; color: #667eea; }
        .form-control-custom, .form-select-custom, textarea.form-control-custom {
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            padding: 12px 15px;
            width: 100%;
            transition: all 0.3s ease;
        }
        .form-control-custom:focus, .form-select-custom:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            outline: none;
        }
        
        .btn-cancel {
            background: #e9ecef;
            color: #6c757d;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
        }
        .btn-submit {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
        }
        .btn-danger-custom {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
        }
        
        .empty-state-custom {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 20px;
        }
        .empty-state-custom i {
            font-size: 60px;
            color: #667eea;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 768px) {
            .card-header-custom { padding: 20px; }
            .header-title { font-size: 20px; flex-direction: column; text-align: center; }
            .card-body-custom { padding: 20px; }
            .btn-action { padding: 4px 8px; font-size: 10px; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>Traitement en cours...</p>
        </div>
    </div>
    
    <div class="container">
        <div class="main-card">
            <div class="card-header-custom">
                <div class="header-title">
                    <div>
                        <i class="fas fa-tags"></i>
                        Types de Décision
                    </div>
                    <div class="badge-stats">
                        <i class="fas fa-list"></i>
                        <span id="totalCount">0</span> type(s)
                    </div>
                </div>
            </div>
            
            <div class="card-body-custom">
                <div class="text-end">
                    <button class="btn-add" data-bs-toggle="modal" data-bs-target="#ajouterModal">
                        <i class="fas fa-plus-circle"></i> Nouveau type de décision
                    </button>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-custom">
                        <thead>
                            <tr>
                                <th style="width: 10%;">ID</th>
                                <th style="width: 70%; text-align: left;">Description</th>
                                <th style="width: 20%;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="typeDecisionTableBody">
                            <tr><td colspan="3" class="text-center py-5"><div class="loading-spinner"></div><p class="mt-3">Chargement...</p></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Ajouter -->
    <div class="modal fade" id="ajouterModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-custom">
                <div class="modal-header modal-header-custom">
                    <h5 class="modal-title">
                        <i class="fas fa-plus-circle"></i> Ajouter un type de décision
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body modal-body-custom">
                    <form id="ajouterForm" onsubmit="return false;">
                        <div class="form-group-custom">
                            <label class="form-label-custom">
                                <i class="fas fa-tag"></i> Description <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control-custom" id="ajouterDescription" 
                                   placeholder="Ex: Accepté, Rejeté, En attente...">
                        </div>
                    </form>
                </div>
                <div class="modal-footer modal-footer-custom">
                    <button type="button" class="btn-cancel" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn-submit" onclick="ajouterTypeDecision()">Ajouter</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Modifier -->
    <div class="modal fade" id="modifierModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-custom">
                <div class="modal-header modal-header-custom">
                    <h5 class="modal-title">
                        <i class="fas fa-edit"></i> Modifier le type de décision
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body modal-body-custom">
                    <form id="modifierForm" onsubmit="return false;">
                        <input type="hidden" id="modifierId">
                        <div class="form-group-custom">
                            <label class="form-label-custom">
                                <i class="fas fa-tag"></i> Description <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control-custom" id="modifierDescription">
                        </div>
                    </form>
                </div>
                <div class="modal-footer modal-footer-custom">
                    <button type="button" class="btn-cancel" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn-submit" onclick="modifierTypeDecision()">Mettre à jour</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Supprimer -->
    <div class="modal fade" id="supprimerModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-custom">
                <div class="modal-header modal-header-custom">
                    <h5 class="modal-title">
                        <i class="fas fa-trash-alt"></i> Confirmation de suppression
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body modal-body-custom">
                    <div style="text-align: center; padding: 20px;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 60px; color: #e74c3c; margin-bottom: 20px;"></i>
                        <p>Êtes-vous sûr de vouloir supprimer ce type de décision ?</p>
                        <p class="text-danger">Cette action est irréversible !</p>
                        <input type="hidden" id="supprimerId">
                        <input type="hidden" id="supprimerDescription">
                    </div>
                </div>
                <div class="modal-footer modal-footer-custom">
                    <button type="button" class="btn-cancel" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn-danger-custom" onclick="supprimerTypeDecision()">Supprimer</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        let currentTypeDecisions = [];
        
        function getCSRFToken() {
            return document.querySelector('[name=csrf-token]').getAttribute('content');
        }
        
        function showLoading() { $('#loadingOverlay').fadeIn(300); }
        function hideLoading() { $('#loadingOverlay').fadeOut(300); }
        
        function showSuccess(message) {
            Swal.fire({
                icon: 'success',
                title: 'Succès !',
                text: message,
                timer: 2500,
                showConfirmButton: false,
                toast: true,
                position: 'top-end'
            });
        }
        
        function showError(message) {
            Swal.fire({
                icon: 'error',
                title: 'Erreur',
                text: message,
                confirmButtonColor: '#e74c3c'
            });
        }
        
        // Charger les types de décision
        function chargerTypeDecisions() {
            showLoading();
            
            $.ajax({
                url: '/api/type-decisions/lister/',
                method: 'GET',
                headers: { 'X-CSRFToken': getCSRFToken() },
                success: function(response) {
                    hideLoading();
                    if (response.success) {
                        currentTypeDecisions = response.type_decisions;
                        afficherTypeDecisions(response.type_decisions);
                        $('#totalCount').text(response.total);
                    } else {
                        showError('Impossible de charger les données');
                    }
                },
                error: function() {
                    hideLoading();
                    showError('Erreur de connexion');
                }
            });
        }
        
        // Afficher les types de décision
        function afficherTypeDecisions(types) {
            const tbody = $('#typeDecisionTableBody');
            tbody.empty();
            
            if (!types || types.length === 0) {
                tbody.html(`
                    <tr>
                        <td colspan="3">
                            <div class="empty-state-custom">
                                <i class="fas fa-folder-open"></i>
                                <p>Aucun type de décision</p>
                                <button class="btn-add" data-bs-toggle="modal" data-bs-target="#ajouterModal">
                                    <i class="fas fa-plus-circle"></i> Créer le premier type
                                </button>
                            </div>
                        </td>
                    </tr>
                `);
                return;
            }
            
            types.forEach(type => {
                const row = `
                    <tr class="fade-in">
                        <td><strong>#${type.id}</strong></td>
                        <td style="text-align: left;"><strong>${escapeHtml(type.Description)}</strong></td>
                        <td>
                            <button class="btn-action btn-edit" onclick="openEditModal(${type.id})">
                                <i class="fas fa-edit"></i> Modifier
                            </button>
                            <button class="btn-action btn-delete" onclick="openDeleteModal(${type.id}, '${escapeHtml(type.Description)}')">
                                <i class="fas fa-trash"></i> Supprimer
                            </button>
                        </td>
                    </tr>
                `;
                tbody.append(row);
            });
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Ajouter un type de décision
        function ajouterTypeDecision() {
            const description = $('#ajouterDescription').val().trim();
            
            if (!description) {
                showError('Veuillez saisir une description');
                return;
            }
            
            showLoading();
            
            $.ajax({
                url: '/api/type-decisions/ajouter/',
                method: 'POST',
                data: JSON.stringify({ Description: description }),
                headers: {
                    'X-CSRFToken': getCSRFToken(),
                    'Content-Type': 'application/json'
                },
                success: function(response) {
                    hideLoading();
                    if (response.success) {
                        showSuccess(response.message);
                        $('#ajouterModal').modal('hide');
                        $('#ajouterForm')[0].reset();
                        chargerTypeDecisions();
                    } else {
                        showError(response.message);
                    }
                },
                error: function(xhr) {
                    hideLoading();
                    const message = xhr.responseJSON?.message || 'Erreur lors de l\'ajout';
                    showError(message);
                }
            });
        }
        
        // Modifier un type de décision
        function openEditModal(id) {
            const type = currentTypeDecisions.find(t => t.id === id);
            if (type) {
                $('#modifierId').val(id);
                $('#modifierDescription').val(type.Description);
                $('#modifierModal').modal('show');
            }
        }
        
        function modifierTypeDecision() {
            const id = $('#modifierId').val();
            const description = $('#modifierDescription').val().trim();
            
            if (!description) {
                showError('Veuillez saisir une description');
                return;
            }
            
            showLoading();
            
            $.ajax({
                url: `/api/type-decisions/modifier/${id}/`,
                method: 'POST',
                data: JSON.stringify({ Description: description }),
                headers: {
                    'X-CSRFToken': getCSRFToken(),
                    'Content-Type': 'application/json'
                },
                success: function(response) {
                    hideLoading();
                    if (response.success) {
                        showSuccess(response.message);
                        $('#modifierModal').modal('hide');
                        $('#modifierForm')[0].reset();
                        chargerTypeDecisions();
                    } else {
                        showError(response.message);
                    }
                },
                error: function(xhr) {
                    hideLoading();
                    const message = xhr.responseJSON?.message || 'Erreur lors de la modification';
                    showError(message);
                }
            });
        }
        
        // Supprimer un type de décision
        function openDeleteModal(id, description) {
            $('#supprimerId').val(id);
            $('#supprimerDescription').val(description);
            $('#supprimerModal').modal('show');
        }
        
        function supprimerTypeDecision() {
            const id = $('#supprimerId').val();
            
            showLoading();
            
            $.ajax({
                url: `/api/type-decisions/supprimer/${id}/`,
                method: 'POST',
                headers: { 'X-CSRFToken': getCSRFToken() },
                success: function(response) {
                    hideLoading();
                    if (response.success) {
                        showSuccess(response.message);
                        $('#supprimerModal').modal('hide');
                        chargerTypeDecisions();
                    } else {
                        showError(response.message);
                    }
                },
                error: function(xhr) {
                    hideLoading();
                    const message = xhr.responseJSON?.message || 'Erreur lors de la suppression';
                    showError(message);
                }
            });
        }
        
        // Initialisation
        $(document).ready(function() {
            chargerTypeDecisions();
        });
        
        // Réinitialisation des formulaires
        $('#ajouterModal').on('hidden.bs.modal', function() {
            $('#ajouterForm')[0].reset();
        });
        
        $('#modifierModal').on('hidden.bs.modal', function() {
            $('#modifierForm')[0].reset();
        });
    </script>
</body>
</html>
