<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - GRH ENGENEERING</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f0f0f0;
            --bg-secondary: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --header-bg: #1a5f7a;
            --card-bg: #ffffff;
            --border-color: #dddddd;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --header-bg: #0f3460;
            --card-bg: #1a1a2e;
            --border-color: #2c2c3e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a5f7a 0%, #0e3d50 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #1a5f7a 0%, #0e3d50 100%);
            color: white;
            text-align: center;
            padding: 30px;
        }

        .login-header i {
            font-size: 3rem;
            color: #f39c12;
            margin-bottom: 10px;
        }

        .login-header h1 {
            font-size: 1.8rem;
        }

        .login-header h1 span {
            color: #f39c12;
        }

        .login-header p {
            margin-top: 10px;
            opacity: 0.8;
        }

        .login-form {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .form-group label i {
            margin-right: 8px;
            color: #f39c12;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f39c12;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(243,156,18,0.3);
        }

        .btn-login i {
            margin-right: 8px;
        }

        .login-footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .login-footer a {
            color: #f39c12;
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .dark-mode-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 25px;
            cursor: pointer;
            z-index: 100;
        }

        .message-error {
            background: #e74c3c;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .login-form {
                padding: 20px;
            }
            
            .login-header {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <button class="dark-mode-toggle" onclick="toggleDarkMode()">
        <i class="fas fa-moon"></i> Mode sombre
    </button>

    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-lock"></i>
            <h1>GRH ENGINEERING<span>Goma</span></h1>
            <p>Connectez-vous à votre compte</p>
        </div>

        <div class="login-form">
    {% if messages %}
        {% for message in messages %}
            <div class="message-error">
                <i class="fas fa-exclamation-triangle"></i> {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'ConnectUtilisateur' %}">
        {% csrf_token %}
        <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email ou Nom d'utilisateur</label>
            <input type="text" name="txtUt" placeholder="exemple@email.com ou nom_utilisateur" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-key"></i> Mot de passe</label>
            <input type="password" name="txtPas" placeholder="Entrez votre mot de passe" required>
        </div>
        <button type="submit" class="btn-login">
            <i class="fas fa-sign-in-alt"></i> Se connecter
        </button>
    </form>
    
    <div class="register-link">
        <p>Pas encore inscrit ? <a href="/Appl/Candidat">Créer un compte</a></p>
    </div>
</div>

        <div class="login-footer">
            <p><i class="fas fa-phone"></i> +243 835137057 | <i class="fas fa-envelope"></i> infogrhengeneering.com</p>
        </div>
    </div>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const btn = document.querySelector('.dark-mode-toggle');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('darkMode', 'true');
                btn.innerHTML = '<i class="fas fa-sun"></i> Mode clair';
            } else {
                localStorage.setItem('darkMode', 'false');
                btn.innerHTML = '<i class="fas fa-moon"></i> Mode sombre';
            }
        }

        function loadDarkMode() {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                const btn = document.querySelector('.dark-mode-toggle');
                if (btn) btn.innerHTML = '<i class="fas fa-sun"></i> Mode clair';
            }
        }

        loadDarkMode();
    </script>
</body>
</html>
