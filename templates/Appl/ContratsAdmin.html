<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Gestion des Contrats - GRH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px;
            font-family: 'Poppins', sans-serif;
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
        }
        .contrat-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border-left: 5px solid #667eea;
        }
        .badge-attente { background: #f39c12; color: white; padding: 5px 12px; border-radius: 20px; font-size: 11px; }
        .badge-accepte { background: #27ae60; color: white; padding: 5px 12px; border-radius: 20px; font-size: 11px; }
        .badge-refuse { background: #e74c3c; color: white; padding: 5px 12px; border-radius: 20px; font-size: 11px; }
        .badge-cdd { background: #3498db; color: white; padding: 5px 12px; border-radius: 20px; font-size: 11px; }
        .badge-cdi { background: #27ae60; color: white; padding: 5px 12px; border-radius: 20px; font-size: 11px; }
        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn-modifier {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 8px;
            font-size: 12px;
        }
        .modal-content-custom {
            border-radius: 25px;
            border: none;
            overflow: hidden;
        }
        .modal-header-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            border: none;
        }
        .form-control-custom, .form-select-custom {
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            padding: 12px 15px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div>
                    <h2><i class="fas fa-file-signature"></i> Gestion des Contrats</h2>
                    <p>Suivi des contrats proposés aux candidats</p>
                </div>
                <a href="/Appl/dashboardAdmin" class="btn btn-outline-light">
                    <i class="fas fa-arrow-left"></i> Retour
                </a>
            </div>
            <div class="card-body p-4" id="contratsContainer">
                <div class="text-center py-5">
                    <div class="loading-spinner"></div>
                    <p>Chargement des contrats...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Modification Contrat -->
    <div class="modal fade" id="editContratModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content modal-content-custom">
                <div class="modal-header modal-header-custom">
                    <h5 class="modal-title"><i class="fas fa-edit"></i> Modifier le contrat</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" id="editContratId">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Titre du contrat</label>
                        <input type="text" class="form-control-custom" id="editTitreContrat">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Description</label>
                        <textarea class="form-control-custom" id="editDescription" rows="3"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Salaire de base</label>
                                <input type="number" class="form-control-custom" id="editSalaire" step="1000">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Prime</label>
                                <input type="number" class="form-control-custom" id="editPrime" step="1000">
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Avantages</label>
                        <textarea class="form-control-custom" id="editAvantages" rows="2" placeholder="Mutuelle, transport, tickets restaurant..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Fichier contrat (PDF)</label>
                        <input type="file" class="form-control-custom" id="editFichierContrat" accept=".pdf">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn-submit" onclick="enregistrerModificationContrat()">Enregistrer</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        let contratsData = [];

        function getCSRFToken() { return document.querySelector('[name=csrf-token]').getAttribute('content'); }

        function chargerContrats() {
            $.ajax({
                url: '/api/contrats-admin/',
                method: 'GET',
                success: function(response) {
                    if (response.success) {
                        contratsData = response.contrats;
                        afficherContrats(response.contrats);
                    }
                },
                error: function() {
                    $('#contratsContainer').html('<div class="text-center py-5 text-danger">Erreur de chargement</div>');
                }
            });
        }

        function afficherContrats(contrats) {
            const container = $('#contratsContainer');
            container.empty();

            if (contrats.length === 0) {
                container.html('<div class="text-center py-5">Aucun contrat enregistré</div>');
                return;
            }

            contrats.forEach(contrat => {
                let badgeType = '';
                let badgeStatut = '';

                if (contrat.type_contrat === 'determine') {
                    badgeType = '<span class="badge-cdd">CDD</span>';
                } else if (contrat.type_contrat === 'indetermine') {
                    badgeType = '<span class="badge-cdi">CDI</span>';
                } else {
                    badgeType = '<span class="badge-attente">Type non choisi</span>';
                }

                if (contrat.statut === 'accepte') {
                    badgeStatut = '<span class="badge-accepte">✅ Accepté</span>';
                } else if (contrat.statut === 'refuse') {
                    badgeStatut = '<span class="badge-refuse">❌ Refusé</span>';
                } else {
                    badgeStatut = '<span class="badge-attente">⏳ En attente</span>';
                }

                container.append(`
                    <div class="contrat-card">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h4><i class="fas fa-file-contract"></i> ${contrat.offre_titre}</h4>
                                <div class="mt-2">
                                    ${badgeType}
                                    ${badgeStatut}
                                    <span class="badge-attente ms-2">${contrat.candidat_nom}</span>
                                </div>
                            </div>
                            <small class="text-muted">Proposé le ${contrat.date_creation}</small>
                        </div>
                        <div class="mt-3 row">
                            <div class="col-md-6">
                                <p><strong>📝 Description :</strong><br>${contrat.description || 'À définir'}</p>
                                <p><strong>💰 Salaire :</strong> ${contrat.salaire || 'À définir'} FC</p>
                            </div>
                            <div class="col-md-6">
                                <p><strong>🎁 Avantages :</strong><br>${contrat.avantages || 'Non spécifiés'}</p>
                                <p><strong>📅 Durée :</strong> ${contrat.duree_texte || 'À définir'}</p>
                            </div>
                        </div>
                        ${contrat.motif_refus ? `<div class="alert alert-warning mt-2"><strong>Motif de refus :</strong><br>${contrat.motif_refus}</div>` : ''}
                        <div class="text-end mt-3">
                            <button class="btn-modifier" onclick="ouvrirModalModifierContrat(${contrat.id})">
                                <i class="fas fa-edit"></i> Modifier le contrat
                            </button>
                        </div>
                    </div>
                `);
            });
        }

        function ouvrirModalModifierContrat(contratId) {
            const contrat = contratsData.find(c => c.id === contratId);
            if (contrat) {
                $('#editContratId').val(contrat.id);
                $('#editTitreContrat').val(contrat.titre_contrat || '');
                $('#editDescription').val(contrat.description || '');
                $('#editSalaire').val(contrat.salaire || '');
                $('#editPrime').val(contrat.prime || '');
                $('#editAvantages').val(contrat.avantages || '');
                $('#editContratModal').modal('show');
            }
        }

        function enregistrerModificationContrat() {
            const contratId = $('#editContratId').val();
            const formData = new FormData();
            formData.append('titre_contrat', $('#editTitreContrat').val());
            formData.append('description', $('#editDescription').val());
            formData.append('salaire', $('#editSalaire').val());
            formData.append('prime', $('#editPrime').val());
            formData.append('avantages', $('#editAvantages').val());
            
            const fichier = $('#editFichierContrat')[0].files[0];
            if (fichier) formData.append('fichier_contrat', fichier);

            Swal.fire({ title: 'Enregistrement...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            $.ajax({
                url: `/api/contrat-admin/modifier/${contratId}/`,
                method: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                headers: { 'X-CSRFToken': getCSRFToken() },
                success: function(response) {
                    Swal.close();
                    if (response.success) {
                        Swal.fire({ icon: 'success', title: 'Succès', text: response.message });
                        $('#editContratModal').modal('hide');
                        chargerContrats();
                    } else {
                        Swal.fire({ icon: 'error', title: 'Erreur', text: response.message });
                    }
                },
                error: function() {
                    Swal.close();
                    Swal.fire({ icon: 'error', title: 'Erreur', text: 'Erreur lors de l\'enregistrement' });
                }
            });
        }

        $(document).ready(function() {
            chargerContrats();
        });
    </script>
</body>
</html>
